spring.application.name=AIPoweredStudentResultAnalyzer

# Postgres datasource (use environment variables in production)
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:h2:./data/studentdb}
spring.datasource.username=${JDBC_DATABASE_USERNAME:sa}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:password}
spring.datasource.driver-class-name=${JDBC_DRIVER_CLASS:org.h2.Driver}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Redis
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
# If using Spring Session:
# spring.session.store-type=redis

# H2 console (optional, useful for local dev)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Gemini API key (keep in environment; do NOT commit secrets)
gemini.api.key=${GEMINI_API_KEY:}

# File upload directory (optional)
app.uploads.dir=${UPLOADS_DIR:uploads}